spring:
  config:
    activate:
      on-profile: prod
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

careerforge:
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:/app/uploads/resumes}
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE:5242880}

logging:
  level:
    root: INFO
    com.careerforge: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
