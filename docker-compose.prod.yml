version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: careerforge-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-careerforge_prod}
      MYSQL_USER: ${DB_USERNAME:-careerforge_app}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db/init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    networks:
      - careerforge-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: careerforge-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-careerforge_prod}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-careerforge_app}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      STORAGE_LOCAL_DIR: /app/uploads/resumes
      STORAGE_MAX_FILE_SIZE: 5242880
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      ADMIN_INIT_EMAIL: ${ADMIN_INIT_EMAIL:-}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-}
    volumes:
      - resume_data:/app/uploads/resumes
    networks:
      - careerforge-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./careerforge-frontend
      dockerfile: Dockerfile
    container_name: careerforge-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - careerforge-network

  nginx:
    image: nginx:1.27-alpine
    container_name: careerforge-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - careerforge-network

volumes:
  mysql_data:
    driver: local
  resume_data:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local

networks:
  careerforge-network:
    driver: bridge
